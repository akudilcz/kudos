# The agent's configuration (spec AGT-017). One `key=value` per line; `#`
# starts a comment; the last assignment of a key wins.
#
# This copy is BAKED INTO THE IMAGE and seeded onto the ramdisk at boot, so the
# agent has a configuration on every machine — including an emulator run, which
# has no USB stick and therefore never had one. Edit it while the machine is
# running and it takes effect the next time `ai` reads it; nothing here survives
# a reboot, because the ramdisk does not.

# Where source is compiled (ARCH-012). kudos carries no compiler, so `compile`
# and the agent's compile tool send source to a factory over HTTP and get back a
# .kudos image this kernel loads.
#
# Boot the compiler-server guest with `vm boot 3`. It prints the address to put
# here as soon as its DHCP lease lands — or set it without editing this file:
#
#     compile factory <host>:8623
#
# factory=192.168.20.1:8623

# The model the agent asks for. Any id the service accepts.
model=deepseek/deepseek-v4-flash-0731

# The service credential is NOT here. It is sealed into the build
# (scripts/agent/sealkey.sh) and opened with `/login <passphrase>` inside an
# `ai` session, so the plaintext is in neither this file nor the repository.
# A stick that carries its own `key=` overrides the sealed one.
