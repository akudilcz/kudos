set timeout=0
set default=0

# Serial-only GRUB: do NOT initialize VGA. Under 4090 passthrough any GRUB/SeaBIOS
# VGA mode leaves a competing legacy VGA that breaks the GPU's GSP PMU init. With a
# serial terminal and no all_video, GRUB never programs VGA; the kernel boots
# headless (boot/boot.asm omits the framebuffer request tag for passthrough).
serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial

# NOTE: the framebuffer mode the kernel receives is set by the multiboot2
# framebuffer header tag in boot/boot.asm (width=0/height=0 = firmware native
# mode, depth 32), NOT by gfxmode — kudos has no GRUB text console, so
# gfxpayload=keep has no gfxterm mode to carry over. gfxmode is kept only as a
# hint for GRUB's own (unused) graphics terminal.

# @VARIANT@ is substituted by scripts/build/mkiso.sh per image (kudos | kudos-smp) so
# the boot menu names which variant this ISO carries. @GSP_MODULES@ is replaced
# with `module2` lines for the GSP firmware blobs when scripts/build/mkiso.sh is run
# with GSP_FW_DIR set, or removed otherwise.
menuentry "@VARIANT@" {
    multiboot2 /boot/kernel.elf
@GSP_MODULES@
    boot
}
